<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>16タイプ一覧｜登山タイプ診断</title>
<meta name="description" content="登山タイプ診断の16タイプを、山の生き物のキャラクターと一緒に紹介します。">
<meta name="theme-color" content="#1E3A31">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="list-page">

  <header class="list-head">
    <h1>16タイプ一覧</h1>
    <p class="list-en"><b>16</b> TYPES OF HIKERS</p>
    <p>それぞれのタイプに、山の生き物のキャラクターがいます。</p>
  </header>

  <!-- ========== 入口：仕組みの解説 ========== -->
  <div id="intro">
    <section class="legend">
      <h2>4つのアルファベットの意味</h2>
      <p>診断結果は <b>PSLC</b> のような4文字で表されます。1文字ずつが、山との付き合い方を分ける軸になっています。</p>
      <div class="axis-table" id="axis-table"></div>
    </section>

    <section class="legend legend-plain">
      <h2>16タイプは4つのグループに分かれます</h2>
      <p>最初の2文字、つまり<b>目的</b>と<b>仲間</b>の組み合わせで、16タイプは大きく4つに分かれます。見たいグループを選んでください。</p>
    </section>

    <div class="group-cards" id="group-cards"></div>
  </div>

  <!-- ========== グループ別の詳細 ========== -->
  <div id="detail" hidden>
    <nav class="group-tabs" id="group-tabs" aria-label="グループの切り替え"></nav>
    <div id="group-body"></div>
    <p class="list-foot hero-link"><a href="#" id="back-intro">4つのグループの説明に戻る</a></p>
  </div>

  <p class="list-foot hero-link"><a href="index.html">診断をはじめる</a></p>

</div>

<script src="data.js"></script>
<script src="characters.js"></script>
<script>
/* =========================================================
   16タイプ一覧
   入口では仕組みの解説だけを見せ、グループを選ぶと詳細に切り替わる。
   URLは ?g=PS でグループ指定、#PSLC でタイプ指定に対応。
   ========================================================= */
const ORDER = ["PS", "PG", "ES", "EG"];
const codesOf = (key) => Object.keys(TYPES).filter((c) => c.slice(0, 2) === key);

/* ---------- 4軸の解説 ---------- */
const AXIS_MEMO = {
  PE: "山頂に立つことか、そこに至る過程か",
  SG: "ひとりで向き合う時間か、分け合う時間か",
  LF: "数字で組み立てるか、その日の感覚か",
  CA: "備えを厚くするか、身軽に踏み込むか",
};
document.getElementById("axis-table").innerHTML = AXES.map((ax, i) => `
  <div class="ax-item">
    <div class="ax-head">
      <span class="ax-pos">${i + 1}</span>
      <span class="ax-name">${ax.title}</span>
    </div>
    <div class="ax-pair">
      <div class="ax-side l"><span class="ax-ltr">${ax.a}</span><p class="ax-word">${ax.aName}</p></div>
      <span class="ax-vs">or</span>
      <div class="ax-side r"><span class="ax-ltr">${ax.b}</span><p class="ax-word">${ax.bName}</p></div>
    </div>
    <div class="ax-bar"><i></i><i></i></div>
    <p class="ax-memo">${AXIS_MEMO[ax.id]}</p>
  </div>`).join("");

/* ---------- 入口の4グループカード ---------- */
document.getElementById("group-cards").innerHTML = ORDER.map((key) => {
  const g = GROUPS[key];
  return `
    <a class="gcard" href="?g=${key}" data-g="${key}" style="background:${g.band}">
      <span class="gcard-bg" style="color:${g.deep}">${g.name}</span>
      <span class="gcard-head">
        <span class="gcard-name" style="color:${g.deep}">${g.name}</span>
        <span class="gcard-lead">${g.lead}</span>
      </span>
      <span class="gcard-chars">
        ${codesOf(key).map((c) => characterSVG(c, "char", true)).join("")}
      </span>
      <span class="gcard-foot">
        <span class="gcard-axis">${g.axis}</span>
        <span class="gcard-code">${key}＊＊</span>
      </span>
    </a>`;
}).join("");

/* ---------- グループ切り替えタブ ---------- */
document.getElementById("group-tabs").innerHTML = ORDER.map((key) => {
  const g = GROUPS[key];
  return `<button class="gtab" data-g="${key}">
    ${characterSVG(codesOf(key)[0], "char gtab-char", true)}
    <span class="gtab-name">${g.name}</span>
  </button>`;
}).join("");

/* ---------- 相性のいいタイプ（結果画面と同じルール） ---------- */
function flipAxis(code, axisIndex) {
  const ax = AXES[axisIndex];
  const chars = code.split("");
  chars[axisIndex] = chars[axisIndex] === ax.a ? ax.b : ax.a;
  return chars.join("");
}
function findMatches(code) {
  return [
    { label: "息が合う相手", code: flipAxis(code, 2), why: "計画の立て方が逆どうし。抜けを補い合えます" },
    { label: "刺激をくれる相手", code: flipAxis(code, 0), why: "登り方は近いのに、山に求めるものが違います" },
  ];
}

/* ---------- タイプ1件のカード ---------- */
function typeCard(code) {
  const t = TYPES[code];
  const c = CHARACTERS[code] || { animal: "", item: "" };
  const g = groupOf(code);

  const axisText = code.split("").map((ch, i) => {
    const ax = AXES[i];
    return `<span class="ax"><b>${ch}</b>${ch === ax.a ? ax.aName : ax.bName}</span>`;
  }).join("");

  const matches = findMatches(code).map((m) => {
    const mt = TYPES[m.code], mc = CHARACTERS[m.code];
    if (!mt) return "";
    return `
      <a class="match" href="#${m.code}" style="background:${groupOf(m.code).band}">
        ${characterSVG(m.code, "char char-sm")}
        <span class="match-body">
          <span class="match-label">${m.label}</span>
          <span class="match-name">
            <span class="match-code" style="background:${groupOf(m.code).deep}">${m.code}</span>
            ${mc ? mc.animal : mt.name}
          </span>
          <span class="match-type">${mt.name}</span>
          <span class="match-why">${m.why}</span>
        </span>
      </a>`;
  }).join("");

  return `
    <article class="type-item" id="${code}">
      <header class="ti-head">
        ${characterSVG(code, "char ti-char")}
        <div class="ti-title">
          <span class="tc-code" style="background:${g.deep}">${code}</span>
          <h3 class="ti-name">${c.animal}</h3>
          <p class="tc-type">${t.name}</p>
          <p class="tc-copy">「${t.copy}」</p>
        </div>
      </header>

      <div class="ti-axes">${axisText}</div>

      <section class="ti-block">
        <h4 class="ti-label">特徴</h4>
        <p class="ti-text">${t.features}</p>
      </section>

      <section class="ti-block ti-caution">
        <h4 class="ti-label">気をつけたいこと</h4>
        <p class="ti-text">${t.caution}</p>
      </section>

      <section class="ti-block">
        <h4 class="ti-label">一緒に登ると面白い相手</h4>
        ${matches}
      </section>

      <p class="ti-item">持ちもの：${c.item}</p>
    </article>`;
}

/* ---------- 表示の切り替え ---------- */
function showIntro() {
  document.getElementById("intro").hidden = false;
  document.getElementById("detail").hidden = true;
}

function showGroup(key, anchor) {
  const g = GROUPS[key];
  if (!g) return showIntro();

  document.getElementById("intro").hidden = true;
  document.getElementById("detail").hidden = false;

  document.querySelectorAll(".gtab").forEach((b) => {
    const on = b.dataset.g === key;
    b.classList.toggle("on", on);
    b.style.background = on ? GROUPS[b.dataset.g].band : "";
    b.style.color = on ? GROUPS[b.dataset.g].deep : "";
  });

  document.getElementById("group-body").innerHTML = `
    <div class="group-hero" style="background:${g.band}">
      <span class="gh-bg" style="color:${g.deep}">${g.name}</span>
      <p class="gh-name" style="color:${g.deep}">${g.name}</p>
      <p class="gh-lead">${g.lead}</p>
      <p class="gh-axis">${g.axis}　${key}＊＊</p>
    </div>
    ${codesOf(key).map(typeCard).join("")}`;

  const target = anchor && document.getElementById(anchor);
  if (target) target.scrollIntoView({ block: "start" });
  else window.scrollTo({ top: 0 });
}

/* ---------- URLから初期表示を決める ----------
   ?g=PS があればそのグループ。なければ #PSLC のアンカーから逆引きする */
function routeFromURL() {
  const q = new URLSearchParams(location.search).get("g");
  const hash = (location.hash || "").slice(1);

  if (q && GROUPS[q]) return showGroup(q, TYPES[hash] ? hash : null);
  if (hash && TYPES[hash]) return showGroup(hash.slice(0, 2), hash);
  if (hash && GROUPS[hash]) return showGroup(hash, null);
  showIntro();
}

/* ---------- 操作 ---------- */
document.getElementById("group-cards").addEventListener("click", (e) => {
  const card = e.target.closest(".gcard");
  if (!card) return;
  e.preventDefault();
  history.pushState(null, "", `?g=${card.dataset.g}`);
  showGroup(card.dataset.g);
});

document.getElementById("group-tabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".gtab");
  if (!tab) return;
  history.pushState(null, "", `?g=${tab.dataset.g}`);
  showGroup(tab.dataset.g);
});

document.getElementById("back-intro").addEventListener("click", (e) => {
  e.preventDefault();
  history.pushState(null, "", location.pathname);
  showIntro();
  window.scrollTo({ top: 0 });
});

/* 詳細内の相性リンクは、別グループなら切り替えてから移動する */
document.getElementById("group-body").addEventListener("click", (e) => {
  const link = e.target.closest(".match");
  if (!link) return;
  const code = link.getAttribute("href").slice(1);
  if (!TYPES[code]) return;
  e.preventDefault();
  history.pushState(null, "", `?g=${code.slice(0, 2)}#${code}`);
  showGroup(code.slice(0, 2), code);
});

window.addEventListener("popstate", routeFromURL);
routeFromURL();
</script>
</body>
</html>
