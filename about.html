<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>診断の仕組み｜登山タイプ診断</title>
<meta name="description" content="4つのアルファベットの意味と、16タイプが分かれる4つの系統について説明します。">
<meta name="theme-color" content="#1E3A31">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="list-page">

  <header class="list-head">
    <h1>診断の仕組み</h1>
    <p class="list-en"><b>16</b> TYPES OF HIKERS</p>
    <p>4つのアルファベットの意味と、16タイプが分かれる4つの系統を説明します。</p>
  </header>

    <section class="legend">
      <h2>4つのアルファベットの意味</h2>
      <p>診断結果は <b>PSLC</b> のような4文字で表されます。1文字ずつが、山との付き合い方を分ける軸になっています。</p>
      <div class="axis-table" id="axis-table"></div>
    </section>

    <section class="legend legend-plain">
      <h2>16タイプは4つの系統に分かれます</h2>
      <p>最初の2文字、つまり<b>目的</b>と<b>仲間</b>の組み合わせで、16タイプは大きく4つに分かれます。見たい系統を選んでください。</p>
    </section>

    <div class="matrix">
      <p class="mx-axis mx-top"><b>P</b>高山・ピークハント</p>
      <div class="mx-mid">
        <p class="mx-axis mx-left"><b>S</b>ソロ</p>
        <div class="mx-grid" id="matrix">
          <svg class="mx-cross" viewBox="0 0 300 300" aria-hidden="true">
            <path d="M150 14 V286" stroke="#AFC3CF" stroke-width="2.4"/>
            <path d="M14 150 H286" stroke="#AFC3CF" stroke-width="2.4"/>
            <path d="M150 6 L144 18 L156 18 Z" fill="#AFC3CF"/>
            <path d="M150 294 L144 282 L156 282 Z" fill="#AFC3CF"/>
            <path d="M6 150 L18 144 L18 156 Z" fill="#AFC3CF"/>
            <path d="M294 150 L282 144 L282 156 Z" fill="#AFC3CF"/>
          </svg>
        </div>
        <p class="mx-axis mx-right"><b>G</b>グループ</p>
      </div>
      <p class="mx-axis mx-bottom"><b>E</b>森・エンジョイ</p>
    </div>

  <p class="list-foot hero-link"><a href="types.html?g=PS">16タイプの詳細を見る</a></p>
  <p class="list-foot hero-link"><a href="index.html">診断をはじめる</a></p>

</div>

<script src="data.js"></script>
<script src="characters.js"></script>
<script>
/* 診断の仕組みのページ。4軸の解説と、4系統のカードを組み立てる */
const ORDER = ["PS", "PG", "ES", "EG"];
const codesOf = (key) => Object.keys(TYPES).filter((c) => c.slice(0, 2) === key);

const AXIS_MEMO = {
  PE: "山頂に立つことに価値を置くか、そこに至る過程を味わうか",
  SG: "ひとりで山と向き合う時間か、誰かと分け合う時間か",
  LF: "数字と情報で組み立てるか、その日の感覚で決めるか",
  CA: "備えを厚くして安全側に振るか、身軽に踏み込むか",
};
document.getElementById("axis-table").innerHTML = AXES.map((ax) => `
  <div class="ax-item">
    <div class="ax-row">
      <div class="ax-end l">
        <span class="ax-ltr">${ax.a}</span>
        <span class="ax-word">${ax.aName}</span>
      </div>
      <div class="ax-mid">
        <span class="ax-title">${ax.title}</span>
        <svg class="ax-arrow" viewBox="0 0 120 12" preserveAspectRatio="none" aria-hidden="true">
          <path d="M14 6 H106" stroke="#C3CFC8" stroke-width="1.6"/>
          <path d="M2 6 L14 1.6 L14 10.4 Z" fill="#1E3A31"/>
          <path d="M118 6 L106 1.6 L106 10.4 Z" fill="#46708F"/>
        </svg>
      </div>
      <div class="ax-end r">
        <span class="ax-ltr">${ax.b}</span>
        <span class="ax-word">${ax.bName}</span>
      </div>
    </div>
    <p class="ax-memo">${AXIS_MEMO[ax.id]}</p>
  </div>`).join("");

/* 目的（縦）× 仲間（横）の4象限。左上から 孤峰・稜線・静林・陽だまり */
document.getElementById("matrix").insertAdjacentHTML("beforeend", ORDER.map((key) => {
  const g = GROUPS[key];
  return `
    <a class="mx-cell" href="types.html?g=${key}" style="background:${g.band}">
      <span class="mx-bg" style="color:${g.deep}">${g.name}</span>
      <span class="mx-name" style="color:${g.deep}">${g.name}</span>
      <span class="mx-lead">${g.lead}</span>
      <span class="mx-chars">
        ${codesOf(key).map((c) => characterSVG(c, "char", true)).join("")}
      </span>
      <span class="mx-code">${key}＊＊</span>
    </a>`;
}).join(""));
</script>
</body>
</html>
